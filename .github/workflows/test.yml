name: Run tests
on: push
jobs:
  client-tests:
    name: Run client tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - run: make test-ci
  server-tests:
    name: Run server tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - run: cd server && make test-ci
